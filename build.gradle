plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	// src/client: sólo la pantalla de configuración de Mod Menu. Así src/main no puede usar por error una clase de
	// net.minecraft.client, que en un servidor dedicado no está
	splitEnvironmentSourceSets()

	mods {
		"soullink" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Segundo cliente para probar con 2 jugadores a la vez: gradlew runClient2
		client2 {
			client()
			configName = "Minecraft Client 2"
			programArgs "--username", "Jugador2"
			runDir "run-client2"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu es opcional: sólo para compilar ModMenuIntegration, que Mod Menu carga si está instalado
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Trinkets Updated es opcional: con él se comparten también sus slots (com.soullink.trinkets). Las pruebas corren con él.
	compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// MIT pide que el aviso de copyright viaje con cada copia, y el jar es la copia que circula.
jar {
	from("LICENSE")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Pruebas automáticas dentro del juego (src/gametest): gradlew runGameTest (servidor sin ventana) y
// gradlew runClientGameTest (abre un cliente de verdad para probar la pantalla de configuración)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "soullink-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// Las pruebas corren con Trinkets Updated para probar que sus slots también se comparten
dependencies {
	gametestImplementation "maven.modrinth:trinkets-updated:${project.trinkets_version}"
}

// El cliente de prueba guarda su config en build/run/clientGameTest y no la pisa: la prueba de la pantalla de
// configuración le cambia valores, y la corrida siguiente tiene que arrancar con los por defecto
def configDelClienteDePrueba = layout.buildDirectory.dir("run/clientGameTest/config")
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	doFirst {
		configDelClienteDePrueba.get().asFile.deleteDir()
	}
}
